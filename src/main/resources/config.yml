# CrossClipboard - seamlessly sync FAWE clipboards across multiple Minecraft servers.
#
# Install the same jar on every backend server that should share clipboards, point all of them at the same
# Redis, and give each server the same FAWE/WorldEdit version.

# Language of player messages: en or de. The files live in plugins/CrossClipboard/lang/ and can be edited.
language: en

# Name shown to players as the origin of a clipboard ("Clipboard from <name> loaded").
# Leave empty to use an automatic name like "server-3f9a".
server-name: ""

# Tell players when a clipboard from another server was loaded for them.
notify-on-restore: true

redis:
  # Either set url (as printed by Coolify, e.g. redis://default:PASSWORD@host:6379/0, or rediss:// for TLS) ...
  url: ""
  # ... or the individual fields below. If url is set, they are ignored.
  host: 10.8.0.1
  port: 6310
  username: "default"
  password: ""
  database: 0
  ssl: false
  # Milliseconds to wait for Redis before giving up on a single request.
  timeout-ms: 3000
  pool-size: 6
  # All keys start with this. Change it if several networks share one Redis.
  key-prefix: crossclipboard

sync:
  # Largest clipboard that is synced, in MB of serialized data. Bigger ones stay local and are skipped.
  max-size-mb: 50
  # How long a stored clipboard is kept after it was last saved, in hours.
  ttl-hours: 24
  # When a player switches servers, the new server waits for the old one to finish uploading. This is the
  # longest it waits (seconds) if the old server never answers, e.g. because it crashed.
  handoff-timeout-seconds: 5
  # Schematic format used for storing. "auto" uses FAWE's fast format when FAWE is installed and the standard
  # schematic format otherwise. Other values are format aliases such as "sponge.3".
  format: auto
